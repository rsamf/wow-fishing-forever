name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - id: check
        # `shell: bash` gives `-eo pipefail`; the default shell would take tee's exit code.
        shell: bash
        run: uv run python scripts/check_release.py | tee -a "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      WOWFISH_HOME: ${{ github.workspace }}/.wowfish-home
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -v
      - run: uv run pyinstaller --clean --noconfirm packaging/wowfish.spec

      - name: Smoke GUI window (Linux)
        if: runner.os == 'Linux'
        # `--version` never loads Tk. Open the real window on a virtual display: it must still be
        # running when timeout stops it (exit 124); a missing module exits sooner with 1.
        run: timeout 15 xvfb-run -a ./dist/wowfish-gui || test $? -eq 124

      - name: Smoke and rename (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./dist/wowfish --version
          ./dist/wowfish doctor
          ./dist/wowfish-gui --version
          mv dist/wowfish "dist/wowfish-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mv dist/wowfish-gui "dist/wowfish-gui-${GITHUB_REF_NAME#v}-${{ matrix.target }}"

      - name: Smoke and rename (Windows)
        # wowfish-gui.exe is a windowed app: PowerShell only waits for it (and sets
        # $LASTEXITCODE) when its output is piped.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\wowfish.exe --version; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\dist\wowfish.exe doctor;    if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\dist\wowfish-gui.exe --version | Out-Host; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $v = $env:GITHUB_REF_NAME.TrimStart("v")
          Move-Item dist\wowfish.exe "dist\wowfish-$v-${{ matrix.target }}.exe"
          Move-Item dist\wowfish-gui.exe "dist\wowfish-gui-$v-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/wowfish-*
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    # Never publish if preflight produced no verdict.
    if: needs.preflight.outputs.prerelease != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum wowfish-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
